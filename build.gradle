plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}


dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3"
}

tasks.withType(ProcessResources).configureEach {
    var props = [minecraft_version:minecraft_version, neo_version:neo_version, mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
